<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">ProjectEgo dataset taxonomy</title>
  <desc id="desc">Seven independent taxonomy axes connect dataset identity with capture, signals, supervision, behavior, access and robot-learning fit.</desc>
  <rect width="1200" height="610" fill="#ffffff"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#18211f}.head{font-size:22px;font-weight:700}.axis{font-size:15px;font-weight:700}.item{font-size:13px;fill:#53605c}.box{fill:#f5f8f7;stroke:#cbd5d1;stroke-width:1}.core{fill:#176b57}.line{stroke:#aebbb6;stroke-width:1.4}.dot{fill:#dff25b}</style>
  <text x="52" y="48" class="head">A multi-axis taxonomy for egocentric robot-learning data</text>
  <text x="52" y="76" class="item">A dataset is a coordinate across all axes—not a single category or modality checklist.</text>
  <rect x="468" y="248" width="264" height="114" rx="5" class="core"/>
  <text x="600" y="294" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Dataset release</text>
  <text x="600" y="322" text-anchor="middle" font-size="14" fill="#dcece7">version · provenance · evidence</text>
  <line x1="468" y1="270" x2="330" y2="171" class="line"/><line x1="468" y1="305" x2="330" y2="305" class="line"/><line x1="468" y1="340" x2="330" y2="458" class="line"/>
  <line x1="732" y1="270" x2="870" y2="135" class="line"/><line x1="732" y1="295" x2="870" y2="252" class="line"/><line x1="732" y1="320" x2="870" y2="369" class="line"/><line x1="732" y1="340" x2="870" y2="486" class="line"/>
  <g transform="translate(52 110)"><rect width="278" height="122" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Capture agent &amp; embodiment</text><text x="20" y="58" class="item">human · robot · simulated · mixed</text><text x="20" y="82" class="item">morphology · manipulator · mobility</text><text x="20" y="106" class="item">participant and hardware population</text></g>
  <g transform="translate(52 244)"><rect width="278" height="122" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Viewpoint &amp; geometry</text><text x="20" y="58" class="item">head · chest · wrist · robot body</text><text x="20" y="82" class="item">ego–exo pairing · calibration · pose</text><text x="20" y="106" class="item">field of view and observability</text></g>
  <g transform="translate(52 400)"><rect width="278" height="122" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Signals &amp; synchronization</text><text x="20" y="58" class="item">RGB · depth · audio · gaze · IMU</text><text x="20" y="82" class="item">pose · tactile · force · proprioception</text><text x="20" y="106" class="item">coverage · rate · timing · validity</text></g>
  <g transform="translate(870 74)"><rect width="278" height="122" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Supervision &amp; actions</text><text x="20" y="58" class="item">labels · language · tracks · pose</text><text x="20" y="82" class="item">latent · end-effector · joint control</text><text x="20" y="106" class="item">coverage · precision · confidence</text></g>
  <g transform="translate(870 208)"><rect width="278" height="122" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Behavior &amp; environment</text><text x="20" y="58" class="item">tasks · skills · objects · scenes</text><text x="20" y="82" class="item">geography · culture · strategy</text><text x="20" y="106" class="item">scale · balance · redundancy</text></g>
  <g transform="translate(870 342)"><rect width="278" height="122" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Access &amp; governance</text><text x="20" y="58" class="item">open · gated · restricted · closed</text><text x="20" y="82" class="item">license · privacy · consent · health</text><text x="20" y="106" class="item">version history and maintenance</text></g>
  <g transform="translate(870 476)"><rect width="278" height="82" rx="4" class="box"/><circle cx="22" cy="22" r="6" class="dot"/><text x="40" y="27" class="axis">Robot-learning fit</text><text x="20" y="58" class="item">perception · VLA · policy · transfer</text></g>
</svg>
