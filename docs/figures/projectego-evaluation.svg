<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">ProjectEgo evidence-backed evaluation pipeline</title>
  <desc id="desc">Sources produce versioned facts and raw observations, which pass through six quality dimensions and task-budget conditioning to yield scores, confidence and recommendations.</desc>
  <rect width="1200" height="540" fill="#ffffff"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0;fill:#17201e}.title{font-size:22px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px;fill:#56635f}.tiny{font-size:11px;fill:#697571}.box{fill:#f6f8f7;stroke:#c7d1ce;stroke-width:1.2}.green{fill:#176b57}.lime{fill:#dff25b}.line{stroke:#8c9a96;stroke-width:1.5;fill:none}.dash{stroke:#a8b4b0;stroke-width:1.2;stroke-dasharray:5 5;fill:none}</style>
  <text x="50" y="46" class="title">Evidence-backed evaluation: facts remain separate from scores</text>
  <text x="50" y="74" class="small">Every transformation is versioned; uncertainty and missingness propagate to task-specific outputs.</text>
  <g transform="translate(50 118)"><rect width="195" height="270" rx="4" class="box"/><text x="22" y="35" class="label">Evidence sources</text><text x="22" y="74" class="small">Papers &amp; documentation</text><text x="22" y="106" class="small">Release metadata</text><text x="22" y="138" class="small">File / frame audits</text><text x="22" y="170" class="small">Annotation audits</text><text x="22" y="202" class="small">Training runs</text><rect x="20" y="225" width="155" height="25" rx="2" class="lime"/><text x="98" y="242" text-anchor="middle" class="tiny">levels 1 → 5</text></g>
  <path d="M245 253 H300" class="line"/><path d="M290 246 L302 253 L290 260" class="line"/>
  <g transform="translate(302 118)"><rect width="215" height="270" rx="4" class="box"/><text x="22" y="35" class="label">Versioned evidence store</text><text x="22" y="74" class="small">Identity &amp; release facts</text><text x="22" y="106" class="small">Raw observations</text><text x="22" y="138" class="small">Source + retrieval time</text><text x="22" y="170" class="small">Evaluator + sample</text><text x="22" y="202" class="small">Conflicts &amp; uncertainty</text><text x="22" y="239" class="tiny">No normalized scores stored here</text></g>
  <path d="M517 253 H568" class="line"/><path d="M558 246 L570 253 L558 260" class="line"/>
  <g transform="translate(570 102)"><rect width="250" height="302" rx="4" fill="#eef4f1" stroke="#9caea8"/><text x="22" y="35" class="label">Quality evaluators</text><text x="22" y="72" class="small">01 · Data integrity</text><text x="22" y="106" class="small">02 · Perceptual quality</text><text x="22" y="140" class="small">03 · Semantic quality</text><text x="22" y="174" class="small">04 · Diversity &amp; scale</text><text x="22" y="208" class="small">05 · Access &amp; governance</text><text x="22" y="242" class="small">06 · Robot utility</text><line x1="22" y1="262" x2="228" y2="262" stroke="#c5d0cc"/><text x="22" y="286" class="tiny">metric definitions + evaluator version</text></g>
  <path d="M820 253 H868" class="line"/><path d="M858 246 L870 253 L858 260" class="line"/>
  <g transform="translate(870 118)"><rect width="280" height="270" rx="4" class="green"/><text x="22" y="35" font-size="15" font-weight="700" fill="#fff">Task-conditioned output</text><text x="22" y="76" font-size="13" fill="#d8e8e3">Dimension score vector</text><text x="22" y="108" font-size="13" fill="#d8e8e3">Evidence coverage</text><text x="22" y="140" font-size="13" fill="#d8e8e3">Confidence &amp; uncertainty</text><text x="22" y="172" font-size="13" fill="#d8e8e3">Learning curve / transfer</text><rect x="20" y="207" width="240" height="42" rx="2" class="lime"/><text x="140" y="233" text-anchor="middle" class="label">Recommendation + rationale</text></g>
  <path d="M690 404 V464 H1010 V388" class="dash"/>
  <rect x="598" y="446" width="184" height="45" rx="3" fill="#fff" stroke="#aebbb6"/><text x="690" y="466" text-anchor="middle" class="tiny">task · budget · constraints</text><text x="690" y="482" text-anchor="middle" class="tiny">explicit weights</text>
  <text x="50" y="468" class="small">Published artifact</text><line x1="50" y1="482" x2="170" y2="482" class="line"/><text x="182" y="487" class="tiny">catalog snapshot + evaluator manifest + benchmark run</text>
</svg>
