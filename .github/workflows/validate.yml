name: Validate catalog

on:
  push:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate_catalog.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON syntax and catalog invariants
        run: python scripts/validate_catalog.py
      - name: Compile validator
        run: python -m py_compile scripts/validate_catalog.py
